packages:
  - "apps/*"
  - "packages/*"
  - "e2e"
storeDir: /pnpm/store
onlyBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - sharp
allowBuilds:
  "@google/genai": false
  '@sentry/cli': true
  esbuild: true
  # Aceleración nativa opcional de msgpackr (dependencia de bullmq): sin ella usa JavaScript puro.
  msgpackr-extract: false
  protobufjs: false
  sharp: true
