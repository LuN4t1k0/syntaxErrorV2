09-funciones-numericas:
  funciones-numericas:
    - codigo: SELECT e.nombre, i.nota, i.nota * 100 / 7 AS porcentaje FROM inscripciones AS i JOIN estudiantes AS e ON e.id = i.estudiante_id;
      espera: no coincide
    - codigo: SELECT e.nombre, i.nota, ROUND(i.nota) * 100 / 7 AS porcentaje FROM inscripciones AS i JOIN estudiantes AS e ON e.id = i.estudiante_id;
