    - codigo: SELECT nombre, UPPER(nombre) || '(' || ciudad || ')' AS credencial FROM estudiantes;
      espera: no coincide
    - codigo: SELECT nombre, UPPER(nombre || ' (' || ciudad || ')') AS credencial FROM estudiantes;
