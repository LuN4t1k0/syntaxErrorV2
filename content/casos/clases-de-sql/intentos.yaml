# Intentos equivocados típicos de cada tarea y un trozo del mensaje que deben recibir, por misión y tarea.
# Los revisa `npm run content:intentos` y la prueba de content/ del repositorio.
01-select-basico:
  select-basico:
    - codigo: SELECT * FROM estudiantes;
      espera: Pide solo esas
    - codigo: SELECT nombre FROM estudiantes;
      espera: debe devolver 2 columnas
    - codigo: SELECT nombre, email FROM estudiantes;
      espera: No existe la columna «email»
02-alias-expresiones:
  alias-expresiones:
    - codigo: SELECT nombre, edad AS edad_actual FROM estudiantes;
      espera: debe devolver 3 columnas
    - codigo: SELECT nombre, edad AS edad_actual, edad AS edad_proximo_anio FROM estudiantes;
      espera: no coincide
03-where-filtros:
  where-filtros:
    - codigo: SELECT nombre, edad, ciudad FROM estudiantes WHERE ciudad = 'Santiago' AND edad > 21;
      espera: Tu consulta trae 2 filas, se esperan 3
    - codigo: SELECT nombre, edad, ciudad FROM estudiantes WHERE ciudad = 'Santiago' OR edad >= 21;
      espera: se esperan 3
    - codigo: SELECT nombre, edad, ciudad FROM estudiantes WHERE ciudad = Santiago AND edad >= 21;
      espera: Tu consulta
04-busqueda-orden-limite:
  busqueda-orden-limite:
    - codigo: SELECT nombre, ciudad FROM estudiantes WHERE ciudad IN ('Santiago', 'Concepción') ORDER BY nombre ASC;
      espera: se esperan 5
    - codigo: SELECT nombre, ciudad FROM estudiantes WHERE ciudad IN ('Santiago', 'Concepción') LIMIT 5;
      espera: no coincide
    - codigo: SELECT nombre, ciudad FROM estudiantes WHERE ciudad IN ('Santiago', 'Concepcion') ORDER BY nombre ASC LIMIT 5;
      espera: trae 4 filas
05-join-inner:
  join-inner:
    - codigo: |-
        SELECT e.nombre, i.nota
        FROM inscripciones AS i
        JOIN estudiantes AS e ON e.id = i.estudiante_id;
      espera: debe devolver 3 columnas
    - codigo: |-
        SELECT e.nombre, c.titulo, i.nota
        FROM inscripciones AS i
        JOIN estudiantes AS e ON e.id = i.curso_id
        JOIN cursos AS c ON c.id = i.curso_id;
      espera: Tu consulta trae 0 filas
06-join-multiple-left:
  join-multiple-left:
    - codigo: |-
        SELECT e.nombre, c.titulo
        FROM estudiantes AS e
        LEFT JOIN inscripciones AS i ON i.estudiante_id = e.id
        JOIN cursos AS c ON c.id = i.curso_id
        ORDER BY e.nombre, c.titulo;
      espera: Tu consulta trae 12 filas, se esperan 14
    - codigo: |-
        SELECT e.nombre, c.titulo
        FROM estudiantes AS e
        LEFT JOIN inscripciones AS i ON i.estudiante_id = e.id
        LEFT JOIN cursos AS c ON c.id = i.curso_id;
      espera: orden
