name: syntaxerror

x-node: &node
  build:
    context: .
    dockerfile: docker/dev.Dockerfile
  image: syntaxerror-dev:latest
  working_dir: /app
  env_file:
    - path: .env
      required: false
  environment: &node-env
    CI: "true"
    DATABASE_URL: postgres://platform:platform@postgres:5432/platform_dev
    DATABASE_URL_TEST: postgres://platform:platform@postgres-test:5432/platform_test
    REDIS_URL: redis://redis:6379
    EMAIL_FROM: "syntaxError.cl <no-responder@syntaxerror.cl>"
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    MAILPIT_URL: http://mailpit:8025
    CHAT_SOCKET_SECRET: ${CHAT_SOCKET_SECRET:-dev-only-socket-secret-change-me}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    TUTOR_PRUEBA: "true"
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - db_node_modules:/app/packages/db/node_modules
    - ui_node_modules:/app/packages/ui/node_modules
    - engines_node_modules:/app/packages/engines/node_modules
    - content_node_modules:/app/packages/content/node_modules
    - queue_node_modules:/app/packages/queue/node_modules
    - ia_node_modules:/app/packages/ia/node_modules
    - web_node_modules:/app/apps/web/node_modules
    - web_next:/app/apps/web/.next
    - worker_node_modules:/app/apps/worker/node_modules
    - e2e_node_modules:/app/e2e/node_modules
    - pnpm_store:/pnpm/store

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  deps:
    <<: *node
    command: pnpm install --frozen-lockfile
    restart: "no"

  tools:
    <<: *node
    profiles: [tools]
    command: bash
    depends_on:
      deps: { condition: service_completed_successfully }
      postgres-test: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  db-setup:
    <<: *node
    command: sh -c "pnpm --filter @syntaxerror/db migrate && pnpm --filter @syntaxerror/content sync && pnpm --filter web db:seed"
    restart: "no"
    environment:
      <<: *node-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@local.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123456}
    depends_on:
      deps: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }

  web:
    <<: *node
    command: pnpm --filter web dev
    ports: ["3000:3000"]
    environment:
      <<: *node-env
      WATCHPACK_POLLING: "true"
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-dev-only-secret}
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      CONTENT_INCLUDE_DRAFTS: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_CHAT_SOCKET_URL: http://localhost:4001
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 120
    depends_on:
      deps: { condition: service_completed_successfully }
      db-setup: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *node
    command: pnpm --filter worker dev
    ports: ["4001:4001"]
    environment:
      <<: *node-env
      CHAT_SOCKET_PORT: "4001"
      APP_URL: http://localhost:3000
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      db-setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble
    profiles: [e2e]
    working_dir: /app/e2e
    network_mode: "service:web"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - e2e_node_modules:/app/e2e/node_modules
    command: ./node_modules/.bin/playwright test
    depends_on:
      web: { condition: service_healthy }
      worker: { condition: service_started }
      mailpit: { condition: service_started }

volumes:
  postgres_data:
  node_modules:
  db_node_modules:
  ui_node_modules:
  engines_node_modules:
  content_node_modules:
  queue_node_modules:
  ia_node_modules:
  web_node_modules:
  web_next:
  worker_node_modules:
  e2e_node_modules:
  pnpm_store:
